#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Override in local.properties as anreal.baseUrl for a physical device.
anreal.baseUrl=http://192.168.13.56:4312

# development stubs login/register/chat. staging and production hit the real API.
# Override in local.properties as anreal.environment.
anreal.environment=staging